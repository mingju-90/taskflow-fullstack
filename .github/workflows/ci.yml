name: 持续集成

on:
  push:
  pull_request:

jobs:
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 恢复 Turborepo 缓存
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 检查格式
        run: pnpm format:check

      - name: 运行静态检查
        run: pnpm lint

      - name: 运行类型检查
        run: pnpm typecheck

      - name: 运行测试
        run: pnpm test

      - name: 运行构建
        run: pnpm build
